<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HarshChat - Saved Messenger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b141a; color: #e9edef; height: 100dvh; display: flex; flex-direction: column; max-width: 500px; margin: 0 auto; border-left: 1px solid #222e35; border-right: 1px solid #222e35; }
    
    /* TOPBAR */
    .topbar { background: #202c33; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .topbar h2 { font-size: 1.05rem; }
    .status { font-size: 0.75rem; color: #00a884; margin-top: 2px; }
    .status.off { color: #8696a0; }
    .small-btn { background: #2a3942; color: #e9edef; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; }

    /* HOME / FRIENDS LIST SCREEN */
    #homeScreen { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: #202c33; padding: 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
    .card h3 { font-size: 0.9rem; color: #00a884; }
    .row { display: flex; gap: 8px; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #374248; background: #111b21; color: #fff; font-size: 0.92rem; outline: none; }
    .btn { padding: 10px 16px; border: none; border-radius: 8px; background: #00a884; color: #0b141a; font-weight: 700; font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
    .id-box { background: #111b21; padding: 10px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-family: monospace; border: 1px dashed #374248; }

    /* SAVED FRIENDS LIST */
    .friend-item {
      background: #182229;
      padding: 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid #222e35;
    }
    .friend-item:active { background: #202c33; }
    .friend-meta { font-size: 0.75rem; color: #8696a0; margin-top: 3px; }

    /* CHAT SCREEN */
    #chatScreen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 78%; padding: 8px 12px; border-radius: 10px; font-size: 0.92rem; line-height: 1.35; word-wrap: break-word; }
    .sent { align-self: flex-end; background: #005c4b; border-top-right-radius: 2px; }
    .received { align-self: flex-start; background: #202c33; border-top-left-radius: 2px; }
    .msg-time { font-size: 0.65rem; color: rgba(255,255,255,0.6); text-align: right; margin-top: 3px; }
    .locked { border: 1px dashed #00a884; color: #00a884; font-weight: 600; cursor: pointer; }
    .burned { background: transparent; border: 1px solid #2a3942; color: #8696a0; font-style: italic; font-size: 0.8rem; }

    /* INPUT BAR */
    .input-bar { background: #202c33; padding: 8px 10px; display: flex; gap: 6px; align-items: center; }
    .input-bar input { border-radius: 20px; padding: 10px 14px; }
    .mode-btn { padding: 8px 10px; border-radius: 16px; border: 1px solid #374248; background: #111b21; color: #8696a0; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .mode-btn.once { border-color: #ff4b4b; color: #ff4b4b; background: #2a181d; }
    .send-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: #00a884; color: #0b141a; font-weight: bold; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="topbar">
    <div>
      <h2 id="headerTitle">HarshChat</h2>
      <div class="status off" id="statusText">Initializing...</div>
    </div>
    <button class="small-btn" id="backBtn" style="display:none;" onclick="goHome()">&#8592; Chats</button>
  </div>

  <!-- HOME SCREEN: PROFILE + SAVED FRIENDS -->
  <div id="homeScreen">
    <div class="card">
      <h3>Your Saved Profile & Permanent Code</h3>
      <div class="row">
        <input type="text" id="myName" placeholder="Your name..." onchange="saveProfile()" />
      </div>
      <div class="id-box">
        <span id="myPeerId">Loading...</span>
        <button class="small-btn" onclick="copyId()">Copy Code</button>
      </div>
    </div>

    <div class="card">
      <h3>Add / Connect New Friend</h3>
      <div class="row">
        <input type="text" id="friendIdInput" placeholder="Enter friend's code..." />
        <button class="btn" onclick="connectByInput()">Connect</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Saved Friends & Chats</h3>
        <button class="small-btn" onclick="clearAllData()" style="color:#ff6b6b;">Clear All</button>
      </div>
      <div id="friendsList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chatScreen">
    <div class="messages" id="messagesBox"></div>
    <div class="input-bar">
      <button class="mode-btn" id="onceToggle" onclick="toggleOnceMode()">Normal</button>
      <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="send-btn" onclick="sendMessage()">&#10148;</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    // LOAD SAVED STORAGE
    let myId = localStorage.getItem('hc_myId');
    if (!myId) {
      myId = 'hc-' + Math.random().toString(36).substring(2, 7);
      localStorage.setItem('hc_myId', myId);
    }
    let myName = localStorage.getItem('hc_myName') || 'Harsh';
    let friends = JSON.parse(localStorage.getItem('hc_friends') || '{}'); // { peerId: { name, lastMsg } }
    let chats = JSON.parse(localStorage.getItem('hc_chats') || '{}');     // { peerId: [ { side, text, time, burned } ] }

    document.getElementById('myName').value = myName;
    document.getElementById('myPeerId').textContent = myId;

    let peer = null;
    let activeConn = null;
    let activeFriendId = null;
    let isOnceMode = false;

    window.addEventListener('load', () => {
      renderFriendsList();
      peer = new Peer(myId);

      peer.on('open', () => {
        setStatus('Ready • Share your code', true);
      });

      peer.on('connection', (incoming) => {
        setupConnection(incoming, true);
      });

      peer.on('error', (err) => {
        setStatus('Offline / Friend not online (' + err.type + ')', false);
      });
    });

    function saveProfile() {
      myName = document.getElementById('myName').value.trim() || 'Harsh';
      localStorage.setItem('hc_myName', myName);
    }

    function saveStorage() {
      localStorage.setItem('hc_friends', JSON.stringify(friends));
      localStorage.setItem('hc_chats', JSON.stringify(chats));
    }

    function connectByInput() {
      const fid = document.getElementById('friendIdInput').value.trim();
      if (!fid) return alert("Enter friend's code!");
      document.getElementById('friendIdInput').value = '';
      openFriendChat(fid, true);
    }

    function openFriendChat(fid, shouldConnect) {
      activeFriendId = fid;
      if (!friends[fid]) friends[fid] = { name: fid, lastMsg: 'Tap to chat' };
      if (!chats[fid]) chats[fid] = [];
      saveStorage();

      document.getElementById('homeScreen').style.display = 'none';
      document.getElementById('chatScreen').style.display = 'flex';
      document.getElementById('backBtn').style.display = 'block';
      document.getElementById('headerTitle').textContent = friends[fid].name;
      renderMessages(fid);

      if (shouldConnect && (!activeConn || activeConn.peer !== fid || !activeConn.open)) {
        setStatus('Connecting to ' + friends[fid].name + '...', false);
        const conn = peer.connect(fid);
        setupConnection(conn, true);
      }
    }

    function setupConnection(conn, switchToChat) {
      activeConn = conn;
      const fid = conn.peer;

      conn.on('open', () => {
        if (!friends[fid]) friends[fid] = { name: fid, lastMsg: 'Connected' };
        saveStorage();
        renderFriendsList();

        if (switchToChat) openFriendChat(fid, false);
        if (activeFriendId === fid) setStatus('Online • Connected', true);

        conn.send({ type: 'intro', name: myName });
      });

      conn.on('data', (data) => {
        if (data.type === 'intro') {
          friends[fid].name = data.name;
          friends[fid].lastMsg = 'Online';
          saveStorage();
          renderFriendsList();
          if (activeFriendId === fid) document.getElementById('headerTitle').textContent = data.name;
        } else if (data.type === 'msg') {
          if (!chats[fid]) chats[fid] = [];
          chats[fid].push({
            id: data.id,
            side: 'received',
            text: data.text,
            time: data.time,
            once: data.once || false,
            burned: false
          });
          friends[fid].lastMsg = data.once ? '🔒 1-time message' : data.text;
          saveStorage();
          renderFriendsList();
          if (activeFriendId === fid) renderMessages(fid);
        }
      });

      conn.on('close', () => {
        if (activeFriendId === fid) setStatus('Friend offline (Viewing saved chat)', false);
      });
    }

    function toggleOnceMode() {
      isOnceMode = !isOnceMode;
      const btn = document.getElementById('onceToggle');
      btn.textContent = isOnceMode ? '1x Burn' : 'Normal';
      btn.classList.toggle('once', isOnceMode);
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !activeFriendId) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const msgId = Date.now().toString(36);

      if (activeConn && activeConn.open && activeConn.peer === activeFriendId) {
        activeConn.send({ type: 'msg', id: msgId, text, time, once: isOnceMode });
      } else {
        alert('Friend is currently offline—message saved locally, reconnect when they open the app.');
      }

      if (!chats[activeFriendId]) chats[activeFriendId] = [];
      chats[activeFriendId].push({
        id: msgId,
        side: 'sent',
        text: isOnceMode ? '🔒 Sent 1-time message' : text,
        time,
        once: false,
        burned: false
      });
      friends[activeFriendId].lastMsg = isOnceMode ? '🔒 Sent 1-time message' : text;
      saveStorage();

      input.value = '';
      renderMessages(activeFriendId);
    }

    function renderMessages(fid) {
      const box = document.getElementById('messagesBox');
      box.innerHTML = '';
      const list = chats[fid] || [];

      list.forEach((m, index) => {
        const div = document.createElement('div');
        if (m.once && !m.burned) {
          div.className = 'msg received locked';
          div.innerHTML = `&#128065; <u>Tap to view 1-time message</u>`;
          div.onclick = () => {
            div.className = 'msg received';
            div.innerHTML = `<div>${esc(m.text)}</div><div class="msg-time">Deleting in 5s...</div>`;
            setTimeout(() => {
              chats[fid][index].burned = true;
              chats[fid][index].text = '';
              saveStorage();
              renderMessages(fid);
            }, 5000);
          };
        } else if (m.burned) {
          div.className = 'msg received burned';
          div.innerHTML = '&#128293; 1-time message deleted';
        } else {
          div.className = `msg ${m.side}`;
          div.innerHTML = `<div>${esc(m.text)}</div><div class="msg-time">${m.time}</div>`;
        }
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    function renderFriendsList() {
      const container = document.getElementById('friendsList');
      const ids = Object.keys(friends);
      if (ids.length === 0) {
        container.innerHTML = '<p style="font-size:0.82rem; color:#8696a0;">No saved friends yet. Add a friend code above!</p>';
        return;
      }
      container.innerHTML = ids.map(id => `
        <div class="friend-item" onclick="openFriendChat('${id}', true)">
          <div>
            <strong>${esc(friends[id].name)}</strong>
            <div class="friend-meta">${esc(friends[id].lastMsg || '')} • ID: ${id}</div>
          </div>
          <span style="color:#00a884; font-size:0.85rem;">Open &#8250;</span>
        </div>
      `).join('');
    }

    function goHome() {
      activeFriendId = null;
      document.getElementById('chatScreen').style.display = 'none';
      document.getElementById('homeScreen').style.display = 'flex';
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('headerTitle').textContent = 'HarshChat';
      setStatus('Ready • Share your code', true);
      renderFriendsList();
    }

    function setStatus(msg, online) {
      const el = document.getElementById('statusText');
      el.textContent = msg;
      el.classList.toggle('off', !online);
    }

    function copyId() {
      navigator.clipboard.writeText(myId);
      alert('Copied permanent code: ' + myId);
    }

    function clearAllData() {
      if (confirm('Delete all saved friends and chat history?')) {
        localStorage.removeItem('hc_friends');
        localStorage.removeItem('hc_chats');
        friends = {};
        chats = {};
        renderFriendsList();
      }
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }
  </script>
</body>
</html>
