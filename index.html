<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Harsh's Neon Fun Hub</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151a24;
      --accent: #00f5d4;
      --pink: #ff2a85;
      --yellow: #fee440;
      --text: #f1f5f9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    header { text-align: center; margin-bottom: 16px; }
    header h1 {
      font-size: 1.6rem;
      background: linear-gradient(90deg, var(--accent), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      background: var(--card);
      padding: 6px;
      border-radius: 12px;
      width: 100%;
      max-width: 460px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 6px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0b0e14;
    }
    .panel {
      display: none;
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid #232b3a;
    }
    .panel.active { display: block; }

    /* WHEEL STYLES */
    .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b0e14;
      color: white;
      outline: none;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      background: var(--pink);
      color: white;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tag {
      background: #232b3a;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag span { cursor: pointer; color: var(--pink); font-weight: bold; }
    .wheel-box {
      text-align: center;
      padding: 20px 12px;
      background: #0b0e14;
      border-radius: 12px;
      border: 2px dashed #334155;
      margin-bottom: 14px;
    }
    #wheel-name { font-size: 1.5rem; font-weight: 800; color: var(--yellow); margin-bottom: 8px; }
    #wheel-prompt { font-size: 0.95rem; color: #cbd5e1; line-height: 1.4; min-height: 42px; }

    /* SOUNDBOARD STYLES */
    .pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .pad {
      aspect-ratio: 1;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      color: #0b0e14;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.08s, filter 0.1s;
    }
    .pad:active { transform: scale(0.92); filter: brightness(1.2); }

    /* ARCADE GAME STYLES */
    canvas {
      width: 100%;
      background: #07090d;
      border-radius: 12px;
      border: 1px solid #334155;
      display: block;
      touch-action: none;
    }
    .game-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .controls-hint {
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>NEON FUN HUB</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('wheel', this)">Roast Wheel</button>
    <button class="tab-btn" onclick="switchTab('sound', this)">Beat Pad</button>
    <button class="tab-btn" onclick="switchTab('game', this)">Neon Dodge</button>
  </div>

  <!-- TAB 1: ROAST OR TOAST WHEEL -->
  <div id="wheel" class="panel active">
    <div class="input-row">
      <input type="text" id="nameInput" placeholder="Add friend's name..." onkeypress="if(event.key==='Enter') addName()" />
      <button class="btn" onclick="addName()">Add</button>
    </div>
    <div class="tags" id="nameTags"></div>
    <div class="wheel-box">
      <div id="wheel-name">Ready to Spin!</div>
      <div id="wheel-prompt">Add names above and hit spin for a random roast, dare, or toast.</div>
    </div>
    <button class="btn" style="width:100%; background: var(--accent); color:#0b0e14;" onclick="spinWheel()">SPIN THE WHEEL</button>
  </div>

  <!-- TAB 2: SYNTH & MEME SOUND PAD -->
  <div id="sound" class="panel">
    <div class="pad-grid" id="padGrid"></div>
    <p class="controls-hint">Tap any pad to trigger WebAudio synth & SFX</p>
  </div>

  <!-- TAB 3: NEON DODGER MINI-GAME -->
  <div id="game" class="panel">
    <div class="game-bar">
      <span>Score: <strong id="score">0</strong></span>
      <span>Best: <strong id="bestScore">0</strong></span>
      <button class="btn" style="padding: 5px 12px; font-size: 0.8rem;" onclick="startGame()">Play / Restart</button>
    </div>
    <canvas id="gameCanvas" width="400" height="360"></canvas>
    <p class="controls-hint">Drag finger on screen or use Left/Right arrows to dodge!</p>
  </div>

  <script>
    // TAB NAVIGATION
    function switchTab(id, el) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      el.classList.add('active');
    }

    // 1. ROAST OR TOAST LOGIC
    let names = ['Harsh', 'Bro', 'Bestie'];
    const prompts = [
      "ROAST: Your phone battery lasts longer than your attention span.",
      "TOAST: Honestly, the group chat would be dead without your energy.",
      "DARE: Send the 5th photo in your gallery to the group right now.",
      "ROAST: You say '5 minutes away' when you haven't even left the house.",
      "TOAST: Certified main-character energy whenever you walk into a room.",
      "DARE: Speak in a dramatic movie trailer voice for the next 2 minutes.",
      "ROAST: Your search history needs its own lawyer.",
      "TOAST: Elite fashion sense and undefeated vibe check."
    ];

    function renderTags() {
      const container = document.getElementById('nameTags');
      container.innerHTML = names.map((n, i) =>
        `<div class="tag">${n} <span onclick="removeName(${i})">&times;</span></div>`
      ).join('');
    }
    function addName() {
      const input = document.getElementById('nameInput');
      const val = input.value.trim();
      if (val) { names.push(val); input.value = ''; renderTags(); }
    }
    function removeName(i) {
      if (names.length > 1) { names.splice(i, 1); renderTags(); }
    }
    function spinWheel() {
      let spins = 0;
      const nameEl = document.getElementById('wheel-name');
      const promptEl = document.getElementById('wheel-prompt');
      promptEl.textContent = "Rolling fate...";
      const interval = setInterval(() => {
        nameEl.textContent = names[Math.floor(Math.random() * names.length)];
        spins++;
        if (spins > 15) {
          clearInterval(interval);
          promptEl.textContent = prompts[Math.floor(Math.random() * prompts.length)];
        }
      }, 70);
    }
    renderTags();

    // 2. WEB AUDIO BEAT PAD
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const pads = [
      { label: 'BASS DROP', color: '#00f5d4', freq: 90, type: 'sine', slide: 30 },
      { label: 'LASER ZAP', color: '#ff2a85', freq: 900, type: 'sawtooth', slide: 120 },
      { label: 'COIN UP', color: '#fee440', freq: 987, type: 'square', slide: 1318 },
      { label: 'RETRO HIT', color: '#00bbf9', freq: 220, type: 'triangle', slide: 55 },
      { label: 'AIRHORN', color: '#f15bb5', freq: 440, type: 'sawtooth', slide: 460 },
      { label: 'UFO BEAM', color: '#9b5de5', freq: 600, type: 'sine', slide: 1200 },
      { label: 'SUB KICK', color: '#00f5d4', freq: 130, type: 'sine', slide: 20 },
      { label: 'GLITCH', color: '#fee440', freq: 1500, type: 'square', slide: 200 },
      { label: 'POWER UP', color: '#ff2a85', freq: 300, type: 'triangle', slide: 800 }
    ];

    const padGrid = document.getElementById('padGrid');
    pads.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'pad';
      btn.style.background = p.color;
      btn.textContent = p.label;
      btn.onclick = () => playSynth(p);
      padGrid.appendChild(btn);
    });

    function playSynth(p) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = p.type;
      osc.frequency.setValueAtTime(p.freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(p.slide, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.28);
    }

    // 3. NEON DODGER MINI-GAME
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let player = { x: 180, y: 315, w: 36, h: 16 };
    let blocks = [];
    let score = 0;
    let best = localStorage.getItem('neonBest') || 0;
    let running = false;
    document.getElementById('bestScore').textContent = best;

    function startGame() {
      player.x = 182;
      blocks = [];
      score = 0;
      running = true;
      document.getElementById('score').textContent = 0;
      requestAnimationFrame(loop);
    }

    function loop() {
      if (!running) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Spawn blocks
      if (Math.random() < 0.055) {
        blocks.push({ x: Math.random() * (canvas.width - 30), y: -20, size: 24, speed: 3 + score * 0.05 });
      }

      // Draw Player
      ctx.fillStyle = '#00f5d4';
      ctx.fillRect(player.x, player.y, player.w, player.h);

      // Update & Draw Blocks
      ctx.fillStyle = '#ff2a85';
      for (let i = blocks.length - 1; i >= 0; i--) {
        let b = blocks[i];
        b.y += b.speed;
        ctx.fillRect(b.x, b.y, b.size, b.size);

        // Collision check
        if (b.x < player.x + player.w && b.x + b.size > player.x &&
            b.y < player.y + player.h && b.y + b.size > player.y) {
          running = false;
          if (score > best) {
            best = score;
            localStorage.setItem('neonBest', best);
            document.getElementById('bestScore').textContent = best;
          }
          ctx.fillStyle = '#fee440';
          ctx.font = 'bold 24px sans-serif';
          ctx.fillText('GAME OVER!', 125, 180);
          return;
        }
        if (b.y > canvas.height) {
          blocks.splice(i, 1);
          score++;
          document.getElementById('score').textContent = score;
        }
      }
      requestAnimationFrame(loop);
    }

    // Touch & Keyboard Controls
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touchX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
      player.x = Math.max(0, Math.min(canvas.width - player.w, touchX - player.w / 2));
    }, { passive: false });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') player.x = Math.max(0, player.x - 24);
      if (e.key === 'ArrowRight') player.x = Math.min(canvas.width - player.w, player.x + 24);
    });
  </script>
</body>
</html>
